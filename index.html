<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Synæsthesia Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#08080F}
  body{font-family:'DM Mono',monospace;color:#fff}

  #canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  #vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 25%,#08080F 80%);
  }

  #topbar{
    position:fixed;top:0;left:0;right:0;
    padding:22px 28px;display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;
  }
  #topbar>*{pointer-events:auto}

  .eyebrow{
    font-family:'Cormorant Garant',serif;font-size:10px;
    letter-spacing:.38em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:3px;
  }
  .title{
    font-family:'Cormorant Garant',serif;font-weight:300;
    font-size:20px;letter-spacing:.06em;color:rgba(255,255,255,.8);
  }
  .ctrl-row{display:flex;gap:6px;margin-bottom:6px;justify-content:flex-end}

  .btn{
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
    border-radius:2px;padding:6px 12px;color:rgba(255,255,255,.55);
    font-size:9px;letter-spacing:.12em;cursor:pointer;
    transition:all .2s;font-family:'DM Mono',monospace;text-transform:uppercase;
  }
  .btn:hover{background:rgba(255,255,255,.12);color:#fff}
  .btn.active{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}

  #left-panel{
    position:fixed;left:0;top:50%;transform:translateY(-50%);
    padding:0 20px;width:210px;
  }
  .panel-label{
    font-size:8px;letter-spacing:.25em;color:rgba(255,255,255,.18);margin-bottom:12px;
  }
  .pill{
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    border-radius:2px;padding:10px 14px;cursor:pointer;
    transition:all .2s;backdrop-filter:blur(8px);margin-bottom:5px;
  }
  .pill:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2);transform:translateX(3px)}
  .pill.active{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.28)}
  .pill-name{font-size:11px;color:rgba(255,255,255,.8);margin-bottom:1px}
  .pill-artist{font-size:9px;color:rgba(255,255,255,.28);letter-spacing:.04em}

  #right-panel{
    position:fixed;right:0;top:50%;transform:translateY(-50%);
    padding:0 22px;width:196px;
  }
  .param-row{margin-bottom:11px}
  .param-head{display:flex;justify-content:space-between;align-items:center}
  .param-label{font-size:9px;letter-spacing:.12em;color:rgba(255,255,255,.32)}
  .param-val{font-size:9px;color:rgba(255,255,255,.45)}
  .bar-bg{height:2px;background:rgba(255,255,255,.07);border-radius:1px;overflow:hidden;margin-top:4px}
  .bar-fill{height:100%;border-radius:1px;transition:width .8s cubic-bezier(.16,1,.3,1)}
  .signal-section{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06)}
  .signal-val{font-size:10px;color:rgba(255,255,255,.42);margin-bottom:3px}
  .signal-sub{font-size:10px;color:rgba(255,255,255,.28);margin-bottom:2px}
  .swatch-row{display:flex;gap:5px;align-items:center;margin-top:14px}
  .swatch{width:22px;height:22px;border-radius:50%}

  #bottom-info{
    position:fixed;bottom:0;left:210px;right:196px;
    padding:0 0 28px 0;text-align:center;pointer-events:none;
    opacity:0;transition:opacity .4s ease;
  }
  #bottom-info.visible{opacity:1}
  .track-name{
    font-family:'Cormorant Garant',serif;font-style:italic;font-weight:300;
    font-size:clamp(26px,4.5vw,52px);line-height:1;
    margin-bottom:6px;letter-spacing:-.01em;
    animation:rise .5s cubic-bezier(.16,1,.3,1) both;
  }
  .track-sub{
    font-family:'Cormorant Garant',serif;font-size:clamp(11px,1.5vw,15px);
    color:rgba(255,255,255,.38);letter-spacing:.1em;margin-bottom:14px;
  }
  .badges{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
  .badge{
    display:inline-block;padding:3px 10px;border-radius:1px;
    font-size:9px;letter-spacing:.15em;text-transform:uppercase;
    border:1px solid rgba(255,255,255,.14);font-family:'DM Mono',monospace;
  }

  #audio-status{
    font-size:8px;letter-spacing:.12em;color:rgba(100,255,160,.6);
    margin-top:4px;display:none;text-align:right;
  }
  #audio-error{
    font-size:8px;color:rgba(255,80,80,.7);letter-spacing:.1em;
    margin-top:4px;display:none;text-align:right;
  }

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  ::-webkit-scrollbar{width:2px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:1px}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="vignette"></div>

<!-- TOP BAR -->
<div id="topbar">
  <div>
    <div class="eyebrow">Synæsthesia Engine</div>
    <div class="title">Music → Vision</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
    <div class="ctrl-row">
      <button class="btn active" id="btn-demo" onclick="setMode('demo')">Demo</button>
      <button class="btn" id="btn-api" onclick="setMode('api')" style="display:none">Spotify API</button>
    </div>
    <div class="ctrl-row">
      <button class="btn" id="btn-mic" onclick="toggleMic()">◎ Mic</button>
      <button class="btn" id="btn-capture" onclick="captureFrame()">↓ Capture</button>
    </div>
    <div id="audio-status">● Audio reactive</div>
    <div id="audio-error"></div>
  </div>
</div>

<!-- LEFT PANEL -->
<div id="left-panel">
  <div class="panel-label">TRACKS</div>
  <div id="track-list"></div>
</div>

<!-- RIGHT PANEL -->
<div id="right-panel">
  <div class="panel-label">VISUAL PARAMETERS</div>
  <div id="params"></div>
  <div class="signal-section">
    <div class="panel-label">SIGNAL</div>
    <div class="signal-val" id="sig-particles"></div>
    <div class="signal-sub" id="sig-bpm"></div>
    <div class="signal-sub" id="sig-palette"></div>
  </div>
  <div class="swatch-row">
    <div class="swatch" id="swatch1"></div>
    <div class="swatch" id="swatch2"></div>
  </div>
</div>

<!-- BOTTOM INFO -->
<div id="bottom-info">
  <div class="track-name" id="track-name-el"></div>
  <div class="track-sub" id="track-sub-el"></div>
  <div class="badges" id="badges-el"></div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const INSTRUMENT_THEMES = {
  strings:{texture:"silk"},brass:{texture:"metallic"},piano:{texture:"crystal"},
  electronic:{texture:"neon"},percussion:{texture:"raw"},ambient:{texture:"mist"},
};

const ORIGIN_PALETTES = {
  "United States":{primary:[255,80,60],  secondary:[60,120,255], label:"American"},
  "United Kingdom":{primary:[180,60,255],secondary:[60,200,255], label:"British"},
  "Brazil":        {primary:[50,200,80], secondary:[255,220,40], label:"Brazilian"},
  "Japan":         {primary:[255,100,150],secondary:[200,220,255],label:"Japanese"},
  "Nigeria":       {primary:[255,160,30],secondary:[80,200,120], label:"Afrobeats"},
  "Jamaica":       {primary:[80,200,60], secondary:[255,220,30], label:"Caribbean"},
  "India":         {primary:[255,120,30],secondary:[160,60,255], label:"South Asian"},
  "France":        {primary:[100,140,255],secondary:[255,80,120],label:"French"},
  "default":       {primary:[140,80,255],secondary:[80,200,255], label:"Global"},
};

const DEMO_TRACKS = [
  {id:"d1",name:"Blinding Lights",  artist:"The Weeknd",      origin:"United States",
   features:{valence:.65,energy:.85,danceability:.81,acousticness:.05,instrumentalness:.00,tempo:171,loudness:-5.8},
   mode:"major",    instruments:["electronic","piano"]},
  {id:"d2",name:"Clair de Lune",    artist:"Debussy",         origin:"France",
   features:{valence:.35,energy:.10,danceability:.20,acousticness:.98,instrumentalness:.99,tempo:54, loudness:-25},
   mode:"minor",    instruments:["piano","strings"]},
  {id:"d3",name:"Savage",           artist:"Wizkid",          origin:"Nigeria",
   features:{valence:.72,energy:.69,danceability:.88,acousticness:.18,instrumentalness:.02,tempo:104,loudness:-7.2},
   mode:"major",    instruments:["electronic","percussion"]},
  {id:"d4",name:"Fake Plastic Trees",artist:"Radiohead",      origin:"United Kingdom",
   features:{valence:.12,energy:.28,danceability:.35,acousticness:.72,instrumentalness:.08,tempo:74, loudness:-12},
   mode:"minor",    instruments:["strings","ambient"]},
  {id:"d5",name:"Ode to My Family", artist:"The Cranberries", origin:"United Kingdom",
   features:{valence:.42,energy:.45,danceability:.48,acousticness:.60,instrumentalness:.01,tempo:90, loudness:-9},
   mode:"major",    instruments:["strings","piano"]},
  {id:"d6",name:"Passionflower",    artist:"Anoushka Shankar",origin:"India",
   features:{valence:.55,energy:.55,danceability:.60,acousticness:.80,instrumentalness:.85,tempo:96, loudness:-11},
   mode:"augmented",instruments:["strings","ambient"]},
];

// ─── MAPPING ─────────────────────────────────────────────────────────────────
function mapFeatures(features, origin) {
  const pal   = ORIGIN_PALETTES[origin] || ORIGIN_PALETTES["default"];
  const w     = features.valence ?? .5;
  const e     = features.energy  ?? .5;
  const ac    = features.acousticness ?? .5;
  const inst  = features.instrumentalness ?? .5;
  const tempo = features.tempo ?? 120;

  const rr = (pal.primary[0]*w + pal.secondary[0]*(1-w))/255;
  const gg = (pal.primary[1]*w + pal.secondary[1]*(1-w))/255;
  const bb = (pal.primary[2]*w + pal.secondary[2]*(1-w))/255;

  return {
    particleCount: Math.floor(800 + e*2400),
    particleSize:  1.5 + (1-ac)*3,
    bloomIntensity:0.3 + e*1.2,
    turbulence:    0.1 + (1-ac)*0.9,
    rotationSpeed: (tempo/120)*0.003,
    colorR:rr, colorG:gg, colorB:bb,
    secR:pal.secondary[0]/255, secG:pal.secondary[1]/255, secB:pal.secondary[2]/255,
    fluidness: ac,
    density:   features.danceability ?? .5,
    haloRadius:0.4 + inst*0.6,
    pulseRate: tempo/60,
    warmth:w, energy:e,
    palette:pal.label, tempo,
  };
}

function getMoodLabel(v) {
  if (v.energy>.8 && v.warmth>.6) return "Euphoric";
  if (v.energy>.7 && v.warmth<.4) return "Fierce";
  if (v.energy<.3 && v.warmth>.6) return "Dreamy";
  if (v.energy<.3 && v.warmth<.4) return "Melancholic";
  if (v.energy>.5 && v.warmth>.5) return "Radiant";
  if (v.energy>.5 && v.warmth<.5) return "Electric";
  return "Hypnotic";
}

// ─── SHADERS ─────────────────────────────────────────────────────────────────
const VERT = `
  attribute vec3 position;
  attribute float size;
  attribute vec3 color;
  attribute float alpha;
  attribute float phase;
  uniform mat4 projectionMatrix,modelViewMatrix;
  uniform float time,turbulence,energy,audioPulse;
  varying vec3 vColor; varying float vAlpha;
  void main(){
    vColor=color; vAlpha=alpha;
    vec3 p=position; float t=time*.5+phase;
    p.x+=sin(t*1.3+p.y*2.0)*turbulence*.15;
    p.y+=cos(t*.9+p.x*1.7)*turbulence*.12;
    p.z+=sin(t*1.1+p.z*1.4)*turbulence*.10;
    vec4 mv=modelViewMatrix*vec4(p,1.0);
    gl_PointSize=size*(300.0/-mv.z)*(0.8+energy*.4)*(1.0+audioPulse*.6);
    gl_Position=projectionMatrix*mv;
  }
`;
const FRAG = `
  precision highp float;
  varying vec3 vColor; varying float vAlpha;
  void main(){
    vec2 uv=gl_PointCoord-.5; float d=length(uv);
    float core=1.-smoothstep(0.,.15,d);
    float glow=1.-smoothstep(0.,.5,d);
    float halo=pow(1.-smoothstep(0.,.5,d),3.);
    float a=(core*.9+glow*.4+halo*.2)*vAlpha;
    gl_FragColor=vec4(vColor*(1.+core*1.5),a);
  }
`;
const AURORA_VERT = `
  attribute vec2 position; varying vec2 vUv;
  void main(){vUv=position*.5+.5;gl_Position=vec4(position,0.,1.);}
`;
const AURORA_FRAG = `
  precision mediump float;
  varying vec2 vUv;
  uniform float time,intensity,audioPulse;
  uniform vec3 col1,col2;
  float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float noise(vec2 p){
    vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
  }
  void main(){
    float t=time*.18;
    float n=noise(vec2(vUv.x*3.+t,vUv.y*1.5-t*.4))*.6+noise(vec2(vUv.x*5.-t*.6,vUv.y*2.5+t*.3))*.4;
    float curtain=pow(1.-vUv.y,1.2)*.55+pow(vUv.y,3.)*.15;
    float shape=smoothstep(.3,.7,n)*curtain*intensity*(1.+audioPulse*.4);
    vec3 c=mix(col1,col2,n);
    gl_FragColor=vec4(c*shape,shape*.55);
  }
`;

// ─── THREE SETUP ─────────────────────────────────────────────────────────────
const canvas  = document.getElementById("canvas");
const W = canvas.clientWidth, H = canvas.clientHeight;
const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,preserveDrawingBuffer:true});
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x08080f,1);
renderer.autoClear = false;

const scene    = new THREE.Scene();
const sceneAu  = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(60, W/H, .1, 1000);
camera.position.z = 5;
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

// Aurora quad
const qGeo = new THREE.BufferGeometry();
qGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array([-1,-1,1,-1,-1,1,1,1]),2));
qGeo.setIndex([0,1,2,1,3,2]);
const auMat = new THREE.ShaderMaterial({
  vertexShader:AURORA_VERT, fragmentShader:AURORA_FRAG,
  uniforms:{time:{value:0},col1:{value:new THREE.Vector3(.4,.1,.9)},
    col2:{value:new THREE.Vector3(.1,.7,.9)},intensity:{value:.4},audioPulse:{value:0}},
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
});
sceneAu.add(new THREE.Mesh(qGeo, auMat));

let particleMesh = null;
let clock = 0;
let currentVisuals = null;
let audioPulse = 0;

function buildParticles(v) {
  if (particleMesh) {
    scene.remove(particleMesh);
    particleMesh.geometry.dispose();
    particleMesh.material.dispose();
  }

  auMat.uniforms.col1.value.set(v.colorR, v.colorG, v.colorB);
  auMat.uniforms.col2.value.set(v.secR, v.secG, v.secB);
  auMat.uniforms.intensity.value = .25 + v.fluidness*.55;

  const N = v.particleCount;
  const pos = new Float32Array(N*3), col = new Float32Array(N*3);
  const sz  = new Float32Array(N),   alp = new Float32Array(N);
  const ph  = new Float32Array(N);

  for (let i=0;i<N;i++){
    const shell=Math.random(), th=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1);
    const r=(0.5+shell*3.5)*v.haloRadius*2.2;
    pos[i*3]=r*Math.sin(phi)*Math.cos(th);
    pos[i*3+1]=r*Math.sin(phi)*Math.sin(th);
    pos[i*3+2]=r*Math.cos(phi);
    const bl=Math.random(), bo=.8+Math.random()*.6;
    col[i*3]  =(v.colorR*bl+v.secR*(1-bl))*bo;
    col[i*3+1]=(v.colorG*bl+v.secG*(1-bl))*bo;
    col[i*3+2]=(v.colorB*bl+v.secB*(1-bl))*bo;
    sz[i]  = v.particleSize*(0.3+Math.random()*1.4)*(shell<.3?1.8:.8);
    alp[i] = .2+Math.random()*.8;
    ph[i]  = Math.random()*Math.PI*2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  geo.setAttribute("color",   new THREE.BufferAttribute(col,3));
  geo.setAttribute("size",    new THREE.BufferAttribute(sz,1));
  geo.setAttribute("alpha",   new THREE.BufferAttribute(alp,1));
  geo.setAttribute("phase",   new THREE.BufferAttribute(ph,1));

  const mat = new THREE.ShaderMaterial({
    vertexShader:VERT, fragmentShader:FRAG,
    uniforms:{time:{value:0},turbulence:{value:v.turbulence},energy:{value:v.energy},audioPulse:{value:0}},
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, vertexColors:true,
  });
  particleMesh = new THREE.Points(geo,mat);
  scene.add(particleMesh);
  currentVisuals = v;
}

function animate(){
  requestAnimationFrame(animate);
  if (!currentVisuals) return;
  const v = currentVisuals;
  clock += .016;

  auMat.uniforms.time.value       = clock;
  auMat.uniforms.audioPulse.value = audioPulse;

  if (particleMesh){
    particleMesh.material.uniforms.time.value       = clock;
    particleMesh.material.uniforms.audioPulse.value = audioPulse;
    particleMesh.rotation.y += v.rotationSpeed;
    particleMesh.rotation.x += v.rotationSpeed*.3;
    const breath = 1 + Math.sin(clock*v.pulseRate*.4)*.04*v.energy;
    const aScale = 1 + audioPulse*.08;
    particleMesh.scale.setScalar(breath*aScale);
  }

  renderer.clear();
  renderer.render(sceneAu, camOrtho);
  renderer.clearDepth();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize",()=>{
  const W2=canvas.clientWidth, H2=canvas.clientHeight;
  renderer.setSize(W2,H2);
  camera.aspect = W2/H2;
  camera.updateProjectionMatrix();
});

// ─── UI ──────────────────────────────────────────────────────────────────────
let currentTrack = null;
let isTransitioning = false;

function r255(v,ch){return Math.round((ch==="r"?v.colorR:ch==="g"?v.colorG:v.colorB)*255);}
function accent(v,a=1){return `rgba(${r255(v,"r")},${r255(v,"g")},${r255(v,"b")},${a})`;}

function selectTrack(track){
  if(isTransitioning) return;
  isTransitioning = true;

  // Highlight active pill
  document.querySelectorAll(".pill").forEach(p=>p.classList.remove("active"));
  document.getElementById("pill-"+track.id)?.classList.add("active");

  // Fade out info
  const info = document.getElementById("bottom-info");
  info.classList.remove("visible");

  setTimeout(()=>{
    currentTrack = track;
    const v = mapFeatures(track.features, track.origin);
    buildParticles(v);
    updateUI(track, v);
    isTransitioning = false;

    // Fade in info (re-trigger animation)
    const tn = document.getElementById("track-name-el");
    tn.style.animation="none"; tn.offsetHeight; tn.style.animation="";
    info.classList.add("visible");
  }, 350);
}

function updateUI(track, v){
  // Track name + sub
  document.getElementById("track-name-el").textContent = track.name;
  document.getElementById("track-name-el").style.color = accent(v,.92);
  document.getElementById("track-name-el").style.textShadow =
    `0 0 50px ${accent(v,.5)}, 0 0 100px ${accent(v,.25)}`;
  document.getElementById("track-sub-el").textContent =
    `${track.artist}  ·  ${track.origin}`;

  // Badges
  const instLabel = track.instruments.map(i=>INSTRUMENT_THEMES[i]?.texture||i).join(" · ");
  document.getElementById("badges-el").innerHTML = `
    <span class="badge" style="color:${accent(v,.85)};border-color:${accent(v,.3)}">${getMoodLabel(v)}</span>
    <span class="badge" style="color:rgba(255,255,255,.32)">${v.palette}</span>
    <span class="badge" style="color:rgba(255,255,255,.32)">${instLabel}</span>
  `;

  // Params
  const params=[
    {l:"Energy",    val:v.energy},
    {l:"Warmth",    val:v.warmth},
    {l:"Turbulence",val:v.turbulence},
    {l:"Fluidity",  val:v.fluidness},
    {l:"Density",   val:v.density},
    {l:"Bloom",     val:Math.min(1,v.bloomIntensity/1.5)},
  ];
  document.getElementById("params").innerHTML = params.map(p=>`
    <div class="param-row">
      <div class="param-head">
        <span class="param-label">${p.l.toUpperCase()}</span>
        <span class="param-val">${(p.val*100).toFixed(0)}</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${p.val*100}%;background:${accent(v,.7)}"></div></div>
    </div>
  `).join("");

  // Signal
  document.getElementById("sig-particles").textContent = v.particleCount.toLocaleString()+" particles";
  document.getElementById("sig-bpm").textContent = `${v.tempo?.toFixed(0)} BPM · ${track.mode}`;
  document.getElementById("sig-palette").textContent = `${v.palette} palette`;

  // Swatches
  const s1=document.getElementById("swatch1"), s2=document.getElementById("swatch2");
  s1.style.background=`rgb(${r255(v,"r")},${r255(v,"g")},${r255(v,"b")})`;
  s1.style.boxShadow=`0 0 10px ${accent(v,.7)}`;
  s2.style.background=`rgb(${Math.round(v.secR*255)},${Math.round(v.secG*255)},${Math.round(v.secB*255)})`;
  s2.style.boxShadow=`0 0 8px rgba(${Math.round(v.secR*255)},${Math.round(v.secG*255)},${Math.round(v.secB*255)},.5)`;
}

// Build track list

DEMO_TRACKS.forEach(t=>{
  const el = document.createElement("div");

  el.id = "pill-"+t.id;

// ─── MODE SWITCH ─────────────────────────────────────────────────────────────
function setMode(m){
  document.getElementById("btn-demo").classList.toggle("active", m==="demo");
}

// ─── MIC / WEB AUDIO ─────────────────────────────────────────────────────────
let audioCtx=null, analyser=null, micStream=null, micRaf=null;
let micActive=false;

async function toggleMic(){
  if(micActive){ stopMic(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx  = new (window.AudioContext||window.webkitAudioContext)();
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    micStream = stream;
    micActive = true;

    document.getElementById("btn-mic").classList.add("active");
    document.getElementById("btn-mic").textContent = "◉ Live";
    document.getElementById("audio-status").style.display="block";
    document.getElementById("audio-error").style.display="none";

    const tick=()=>{
      micRaf=requestAnimationFrame(tick);
      analyser.getByteFrequencyData(buf);
      const avg=buf.slice(0,32).reduce((a,b)=>a+b,0)/32;
      audioPulse = avg/255;
    };
    tick();
  } catch(e){
    document.getElementById("audio-error").textContent="Mic access denied";
    document.getElementById("audio-error").style.display="block";
  }
}

function stopMic(){
  if(micRaf) cancelAnimationFrame(micRaf);
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  if(audioCtx) audioCtx.close();
  audioPulse=0; micActive=false;
  document.getElementById("btn-mic").classList.remove("active");
  document.getElementById("btn-mic").textContent="◎ Mic";
  document.getElementById("audio-status").style.display="none";
}

// ─── CAPTURE ─────────────────────────────────────────────────────────────────
function captureFrame(){
  // Force one more render so preserveDrawingBuffer is fresh
  renderer.clear();
  renderer.render(sceneAu, camOrtho);
  renderer.clearDepth();
  renderer.render(scene, camera);
  const name = (currentTrack?.name||"frame").replace(/\s/g,"_");
  const a=document.createElement("a");
  a.download=`synesthesia-${name}.png`;
  a.href=canvas.toDataURL("image/png");
  a.click();
}
