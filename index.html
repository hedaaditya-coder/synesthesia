<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Synæsthesia Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#08080F}
  body{font-family:'DM Mono',monospace;color:#fff;touch-action:none}
  #canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 22%,#08080F 80%)}
  #topbar{position:fixed;top:0;left:0;right:0;padding:16px 14px;
    display:flex;justify-content:space-between;align-items:flex-start;z-index:10}
  .eyebrow{font-family:'Cormorant Garant',serif;font-size:9px;letter-spacing:.35em;
    text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:2px}
  .title{font-family:'Cormorant Garant',serif;font-weight:300;font-size:17px;
    letter-spacing:.06em;color:rgba(255,255,255,.75)}
  .btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:3px;padding:7px 12px;color:rgba(255,255,255,.55);font-size:10px;
    letter-spacing:.1em;cursor:pointer;transition:all .2s;font-family:'DM Mono',monospace;
    text-transform:uppercase;-webkit-tap-highlight-color:transparent}
  .btn:active{background:rgba(255,255,255,.18)}
  .btn.on{background:rgba(100,255,160,.12);border-color:rgba(100,255,160,.35);color:rgba(100,255,160,.9)}
  #left-panel{position:fixed;left:0;top:50%;transform:translateY(-50%);
    padding:0 12px;width:170px;max-height:72vh;overflow-y:auto;z-index:10}
  .panel-label{font-size:7px;letter-spacing:.25em;color:rgba(255,255,255,.16);margin-bottom:9px}
  .pill{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    border-radius:3px;padding:9px 11px;cursor:pointer;transition:all .2s;margin-bottom:5px;
    -webkit-tap-highlight-color:transparent}
  .pill:active,.pill.active{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
  .pill-name{font-size:11px;color:rgba(255,255,255,.82);margin-bottom:1px}
  .pill-artist{font-size:9px;color:rgba(255,255,255,.28)}
  #right-panel{position:fixed;right:0;top:50%;transform:translateY(-50%);
    padding:0 14px;width:155px;z-index:10}
  .param-row{margin-bottom:9px}
  .param-head{display:flex;justify-content:space-between}
  .param-label{font-size:8px;letter-spacing:.1em;color:rgba(255,255,255,.28)}
  .param-val{font-size:8px;color:rgba(255,255,255,.38)}
  .bar-bg{height:2px;background:rgba(255,255,255,.07);border-radius:1px;margin-top:3px;overflow:hidden}
  .bar-fill{height:100%;border-radius:1px;transition:width .7s cubic-bezier(.16,1,.3,1)}
  .swatch-row{display:flex;gap:5px;margin-top:12px}
  .swatch{width:19px;height:19px;border-radius:50%}
  #bottom-info{position:fixed;bottom:0;left:170px;right:155px;
    padding:0 10px 22px;text-align:center;pointer-events:none;z-index:10;
    opacity:0;transition:opacity .4s}
  #bottom-info.show{opacity:1}
  .track-name{font-family:'Cormorant Garant',serif;font-style:italic;font-weight:300;
    font-size:clamp(20px,4.5vw,46px);line-height:1.1;margin-bottom:4px}
  .track-sub{font-family:'Cormorant Garant',serif;font-size:12px;
    color:rgba(255,255,255,.32);letter-spacing:.08em;margin-bottom:11px}
  .badges{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
  .badge{font-size:8px;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid rgba(255,255,255,.13);padding:3px 8px;border-radius:2px}
  #mic-status{font-size:8px;color:rgba(100,255,160,.7);letter-spacing:.1em;margin-top:3px;display:none}
  /* effect mode pill row */
  #mode-bar{position:fixed;bottom:22px;right:14px;z-index:10;
    display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .modeBtn{font-size:7px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;
    border-radius:2px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
    color:rgba(255,255,255,.35);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .modeBtn.active{border-color:rgba(255,255,255,.28);color:rgba(255,255,255,.8);background:rgba(255,255,255,.1)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="vignette"></div>

<div id="topbar">
  <div>
    <div class="eyebrow">Synæsthesia Engine</div>
    <div class="title">Music → Vision</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px">
    <div style="display:flex;gap:5px">
      <button class="btn" id="btn-mic" onclick="toggleMic()">◎ Mic</button>
      <button class="btn" onclick="captureFrame()">↓</button>
    </div>
    <div id="mic-status">● Live</div>
  </div>
</div>

<div id="left-panel">
  <div class="panel-label">TRACKS</div>
  <div id="track-list"></div>
</div>

<div id="right-panel">
  <div class="panel-label">PARAMETERS</div>
  <div id="params"></div>
  <div class="swatch-row">
    <div class="swatch" id="sw1"></div>
    <div class="swatch" id="sw2"></div>
  </div>
</div>

<div id="bottom-info">
  <div class="track-name" id="tname"></div>
  <div class="track-sub" id="tsub"></div>
  <div class="badges" id="tbadges"></div>
</div>

<!-- Effect mode switcher -->
<div id="mode-bar">
  <div class="panel-label" style="color:rgba(255,255,255,.14)">EFFECT</div>
  <div class="modeBtn active" id="m-orbit"   onclick="setMode('orbit')">Orbit</div>
  <div class="modeBtn"        id="m-scatter"  onclick="setMode('scatter')">Scatter</div>
  <div class="modeBtn"        id="m-rain"     onclick="setMode('rain')">Rain</div>
  <div class="modeBtn"        id="m-vortex"   onclick="setMode('vortex')">Vortex</div>
</div>

<script>
// ── PALETTES & DATA ───────────────────────────────────────────────────────────
const PALETTES={
  "United States":{p:[255,80,60], s:[60,120,255],label:"American"},
  "United Kingdom":{p:[180,60,255],s:[60,200,255],label:"British"},
  "Brazil":        {p:[50,200,80], s:[255,220,40],label:"Brazilian"},
  "Nigeria":       {p:[255,160,30],s:[80,200,120],label:"Afrobeats"},
  "India":         {p:[255,120,30],s:[160,60,255],label:"South Asian"},
  "France":        {p:[100,140,255],s:[255,80,120],label:"French"},
  "default":       {p:[140,80,255],s:[80,200,255],label:"Global"},
};
// Accent colours outside any track theme — used for rain "stray" particles
const STRAY_COLORS=[[255,220,80],[80,255,200],[255,80,180],[120,255,100],[255,140,60],[60,180,255],[200,80,255]];
const ITEXTURES={strings:"silk",piano:"crystal",electronic:"neon",percussion:"raw",ambient:"mist"};
const TRACKS=[
  {id:"t1",name:"Blinding Lights",   artist:"The Weeknd",      origin:"United States",
   f:{valence:.65,energy:.85,dance:.81,acoustic:.05,tempo:171},mode:"major",    inst:["electronic","piano"]},
  {id:"t2",name:"Clair de Lune",     artist:"Debussy",         origin:"France",
   f:{valence:.35,energy:.10,dance:.20,acoustic:.98,tempo:54}, mode:"minor",    inst:["piano","strings"]},
  {id:"t3",name:"Savage",            artist:"Wizkid",          origin:"Nigeria",
   f:{valence:.72,energy:.69,dance:.88,acoustic:.18,tempo:104},mode:"major",    inst:["electronic","percussion"]},
  {id:"t4",name:"Fake Plastic Trees",artist:"Radiohead",       origin:"United Kingdom",
   f:{valence:.12,energy:.28,dance:.35,acoustic:.72,tempo:74}, mode:"minor",    inst:["strings","ambient"]},
  {id:"t5",name:"Ode to My Family",  artist:"The Cranberries", origin:"United Kingdom",
   f:{valence:.42,energy:.45,dance:.48,acoustic:.60,tempo:90}, mode:"major",    inst:["strings","piano"]},
  {id:"t6",name:"Passionflower",     artist:"Anoushka Shankar",origin:"India",
   f:{valence:.55,energy:.55,dance:.60,acoustic:.80,tempo:96}, mode:"augmented",inst:["strings","ambient"]},
];

function mapV(f,origin){
  const pal=PALETTES[origin]||PALETTES["default"];
  const w=f.valence,e=f.energy,ac=f.acoustic;
  return{
    count:Math.floor(500+e*1800),size:1.1+(1-ac)*2.6,
    turbulence:0.07+(1-ac)*0.82,rotSpeed:(f.tempo/120)*0.003,
    r:(pal.p[0]*w+pal.s[0]*(1-w))/255,
    g:(pal.p[1]*w+pal.s[1]*(1-w))/255,
    b:(pal.p[2]*w+pal.s[2]*(1-w))/255,
    sr:pal.s[0]/255,sg:pal.s[1]/255,sb:pal.s[2]/255,
    fluid:ac,density:f.dance,halo:0.48+(1-e)*0.38,
    pulse:f.tempo/60,warmth:w,energy:e,label:pal.label,tempo:f.tempo,
  };
}
function mood(v){
  if(v.energy>.8&&v.warmth>.6)return"Euphoric";
  if(v.energy>.7&&v.warmth<.4)return"Fierce";
  if(v.energy<.3&&v.warmth>.6)return"Dreamy";
  if(v.energy<.3&&v.warmth<.4)return"Melancholic";
  if(v.energy>.5&&v.warmth>.5)return"Radiant";
  if(v.energy>.5&&v.warmth<.5)return"Electric";
  return"Hypnotic";
}

// ── CANVAS SETUP ──────────────────────────────────────────────────────────────
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener("resize",resize);

// ── STATE ─────────────────────────────────────────────────────────────────────
let particles=[],rainDrops=[],shockwaves=[],vis=null,audioPulse=0,clock=0;
let effectMode="orbit"; // orbit | scatter | rain | vortex
// Vortex spin state per particle
let vortexDir=1; // +1 CW, -1 CCW
let vortexFlipTimer=0;
// Beat detection
let lastBeatTime=0,beatInterval=500,prevPulse=0,beatFlash=0;
// Colour flash state
let flashR=0,flashG=0,flashB=0,flashAlpha=0;
// Scatter explosion state
let scatterStrength=0;

// ── PARTICLE INIT ─────────────────────────────────────────────────────────────
function initParticles(v){
  particles=[];
  const N=v.count;
  for(let i=0;i<N;i++){
    const shell=Math.pow(Math.random(),.5);
    const th=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1);
    const blend=Math.random(), bright=0.65+Math.random()*.7;
    particles.push({
      // unit sphere coords
      ux:Math.sin(phi)*Math.cos(th),
      uy:Math.sin(phi)*Math.sin(th),
      uz:Math.cos(phi),
      r:shell,           // 0-1 shell depth
      baseR:shell,
      cr:Math.min(1,(v.r*blend+v.sr*(1-blend))*bright),
      cg:Math.min(1,(v.g*blend+v.sg*(1-blend))*bright),
      cb:Math.min(1,(v.b*blend+v.sb*(1-blend))*bright),
      size:v.size*(0.35+Math.random()*1.5)*(shell<.2?2.2:.85),
      alpha:0.12+Math.random()*.88,
      phase:Math.random()*Math.PI*2,
      speed:0.25+Math.random()*.75,
      // vortex angle on XZ plane
      vAngle:Math.atan2(Math.sin(phi)*Math.sin(th), Math.sin(phi)*Math.cos(th)),
      vRadius:Math.sqrt(Math.pow(Math.sin(phi)*Math.cos(th),2)+Math.pow(Math.sin(phi)*Math.sin(th),2)),
      // scatter velocity
      svx:(Math.random()-.5)*2, svy:(Math.random()-.5)*2, svz:(Math.random()-.5)*2,
      scatterT:0,
    });
  }
}

function initRain(v){
  rainDrops=[];
  const N=Math.floor(120+v.energy*180);
  for(let i=0;i<N;i++) spawnDrop(v,true);
}

function spawnDrop(v,initial){
  const stray=Math.random()<0.35; // 35% borrow colour from outside theme
  let cr,cg,cb;
  if(stray){
    const sc=STRAY_COLORS[Math.floor(Math.random()*STRAY_COLORS.length)];
    cr=sc[0]/255; cg=sc[1]/255; cb=sc[2]/255;
  } else {
    const blend=Math.random(),bright=0.6+Math.random()*.8;
    cr=Math.min(1,(v.r*blend+v.sr*(1-blend))*bright);
    cg=Math.min(1,(v.g*blend+v.sg*(1-blend))*bright);
    cb=Math.min(1,(v.b*blend+v.sb*(1-blend))*bright);
  }
  rainDrops.push({
    x:Math.random()*W,
    y:initial ? Math.random()*H : -20,
    speed:2.5+Math.random()*5+v.energy*4,
    length:8+Math.random()*28+v.energy*20,
    width:0.5+Math.random()*1.5,
    alpha:0.15+Math.random()*.7,
    cr,cg,cb,stray,
    wobble:Math.random()*Math.PI*2,
    wobbleSpeed:(Math.random()-.5)*0.05,
  });
}

// ── BEAT DETECTION ────────────────────────────────────────────────────────────
function detectBeat(pulse){
  const now=clock*1000;
  const isRising=pulse>prevPulse+0.12 && pulse>0.3;
  const gapOk=now-lastBeatTime>beatInterval*0.6;
  if(isRising&&gapOk){
    beatInterval=Math.max(250,Math.min(2000,(now-lastBeatTime)*0.4+beatInterval*0.6));
    lastBeatTime=now;
    onBeat(pulse);
  }
  prevPulse=pulse;
}

function onBeat(strength){
  // Shockwave ring
  shockwaves.push({x:W/2,y:H/2,r:0,maxR:Math.min(W,H)*0.55,alpha:0.7+strength*.3,strength});
  // Colour flash
  if(vis){
    flashR=Math.round(vis.r*255); flashG=Math.round(vis.g*255); flashB=Math.round(vis.b*255);
    flashAlpha=0.18+strength*.18;
  }
  // Scatter burst
  scatterStrength=Math.max(scatterStrength, strength*1.8);
  // Vortex direction flip on strong beat
  if(strength>.65) vortexDir*=-1;
}

// ── DRAW FRAME ───────────────────────────────────────────────────────────────
function drawFrame(){
  requestAnimationFrame(drawFrame);
  if(!vis) return;
  clock+=0.016;

  // Beat detection from audio
  if(audioPulse>0) detectBeat(audioPulse);
  beatFlash*=0.9;
  flashAlpha*=0.88;
  scatterStrength*=0.92;
  vortexFlipTimer+=0.016;

  // Background — trail length varies by mode
  const trailAlpha = effectMode==="rain" ? 0.55 : 0.16;
  ctx.fillStyle=`rgba(8,8,15,${trailAlpha})`;
  ctx.fillRect(0,0,W,H);

  // Colour flash on beat
  if(flashAlpha>0.01){
    ctx.fillStyle=`rgba(${flashR},${flashG},${flashB},${flashAlpha})`;
    ctx.fillRect(0,0,W,H);
  }

  // Aurora
  drawAurora();

  // Mode-specific render
  if(effectMode==="rain") drawRain();
  else drawOrbitParticles();

  // Shockwaves
  drawShockwaves();
}

// ── ORBIT / SCATTER / VORTEX ─────────────────────────────────────────────────
function drawOrbitParticles(){
  const v=vis;
  const cx=W/2, cy=H/2;
  const baseScale=Math.min(W,H)*0.46;

  // Rotation angles
  const rotY=clock*v.rotSpeed;
  const rotX=clock*v.rotSpeed*0.28;

  // Breathing pulse — more dramatic
  const breath=1+Math.sin(clock*v.pulse*.4)*.09*v.energy;
  const aBoost=1+audioPulse*.35;
  const globalScale=baseScale*breath*aBoost*(1+scatterStrength*.12);

  const projected=particles.map(p=>{
    let px=p.ux, py=p.uy, pz=p.uz;
    const shellRadius=(0.4+p.r*3.6)*v.halo;

    if(effectMode==="vortex"){
      // Vortex: particles orbit on their XZ band, clockwise/anticlockwise
      const vSpeed=0.012*(0.5+p.speed)*vortexDir*(1+audioPulse*.8);
      p.vAngle+=vSpeed;
      const xz=Math.sqrt(px*px+pz*pz)||0.001;
      px=(px/xz)*p.vRadius*Math.cos(p.vAngle);
      pz=(pz/xz)*p.vRadius*Math.sin(p.vAngle);
      // Gradual Y drift
      py+=Math.sin(clock*.3+p.phase)*0.003;
    } else if(effectMode==="scatter"){
      // Scatter: particles explode outward on beat then drift back
      if(scatterStrength>.05){
        p.scatterT=Math.min(1,p.scatterT+0.04*scatterStrength);
      } else {
        p.scatterT=Math.max(0,p.scatterT-0.02);
      }
      px+=p.svx*p.scatterT*0.8;
      py+=p.svy*p.scatterT*0.8;
      pz+=p.svz*p.scatterT*0.8;
    }

    // Global rotation (all modes)
    const x1=px*Math.cos(rotY)-pz*Math.sin(rotY);
    const z1=px*Math.sin(rotY)+pz*Math.cos(rotY);
    const y2=py*Math.cos(rotX)-z1*Math.sin(rotX);
    const z2=py*Math.sin(rotX)+z1*Math.cos(rotX);

    // Turbulence
    const t=clock*.45+p.phase;
    const tx=Math.sin(t*1.3+py*2.1)*v.turbulence*.14;
    const ty=Math.cos(t*.9+px*1.8)*v.turbulence*.11;

    const depth=(z2+1)*.5;
    const sx=cx+(x1+tx)*shellRadius*globalScale/baseScale;
    const sy=cy+(y2+ty)*shellRadius*globalScale/baseScale;
    const sz=p.size*(0.45+depth*.85)*(1+audioPulse*.45);
    const sa=p.alpha*(0.25+depth*.75);
    return{sx,sy,sz,sa,p,depth};
  });

  projected.sort((a,b)=>a.depth-b.depth);

  for(const{sx,sy,sz,sa,p} of projected){
    if(sx<-sz*4||sx>W+sz*4||sy<-sz*4||sy>H+sz*4) continue;
    const r=Math.round(p.cr*255), g=Math.round(p.cg*255), b=Math.round(p.cb*255);

    // Outer diffuse halo
    const g1=ctx.createRadialGradient(sx,sy,0,sx,sy,sz*4);
    g1.addColorStop(0,`rgba(${r},${g},${b},${sa*.15})`);
    g1.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.beginPath();ctx.arc(sx,sy,sz*4,0,Math.PI*2);
    ctx.fillStyle=g1;ctx.fill();

    // Bright core
    const g2=ctx.createRadialGradient(sx,sy,0,sx,sy,sz*1.1);
    g2.addColorStop(0,`rgba(${Math.min(255,r+90)},${Math.min(255,g+90)},${Math.min(255,b+90)},${sa*.95})`);
    g2.addColorStop(0.35,`rgba(${r},${g},${b},${sa*.55})`);
    g2.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.beginPath();ctx.arc(sx,sy,sz*1.1,0,Math.PI*2);
    ctx.fillStyle=g2;ctx.fill();
  }
}

// ── RAIN MODE ─────────────────────────────────────────────────────────────────
function drawRain(){
  const v=vis;
  const speedMult=1+audioPulse*2.5;

  for(let i=rainDrops.length-1;i>=0;i--){
    const d=rainDrops[i];
    d.wobble+=d.wobbleSpeed;
    d.x+=Math.sin(d.wobble)*0.4;
    d.y+=d.speed*speedMult;

    const r=Math.round(d.cr*255), g=Math.round(d.cg*255), b=Math.round(d.cb*255);
    const a=d.alpha*(0.6+audioPulse*.6);

    // Draw streak
    ctx.save();
    ctx.strokeStyle=`rgba(${r},${g},${b},${a})`;
    ctx.lineWidth=d.width*(1+audioPulse*.5);
    ctx.shadowColor=`rgba(${r},${g},${b},${a*.7})`;
    ctx.shadowBlur=d.stray ? 12 : 5;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x+Math.sin(d.wobble)*2, d.y-d.length*(1+audioPulse*.4));
    ctx.stroke();

    // Splat dot at head
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.width*1.4,0,Math.PI*2);
    ctx.fillStyle=`rgba(${Math.min(255,r+60)},${Math.min(255,g+60)},${Math.min(255,b+60)},${a})`;
    ctx.fill();
    ctx.restore();

    // Recycle when off screen
    if(d.y-d.length>H){
      rainDrops.splice(i,1);
      spawnDrop(v,false);
    }
  }
}

// ── SHOCKWAVES ────────────────────────────────────────────────────────────────
function drawShockwaves(){
  for(let i=shockwaves.length-1;i>=0;i--){
    const s=shockwaves[i];
    s.r+=12+s.strength*8;
    s.alpha*=0.82;
    if(s.alpha<0.01||s.r>s.maxR){shockwaves.splice(i,1);continue;}
    if(!vis) continue;
    const r=Math.round(vis.r*255), g=Math.round(vis.g*255), b=Math.round(vis.b*255);
    ctx.save();
    ctx.strokeStyle=`rgba(${r},${g},${b},${s.alpha})`;
    ctx.lineWidth=2.5*(1-s.r/s.maxR)+0.5;
    ctx.shadowColor=`rgba(${r},${g},${b},${s.alpha*.8})`;
    ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.stroke();
    // Second inner ring
    if(s.r>30){
      ctx.strokeStyle=`rgba(${r},${g},${b},${s.alpha*.4})`;
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r*.7,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ── AURORA ───────────────────────────────────────────────────────────────────
function drawAurora(){
  const t=clock*.14;
  const r=Math.round(vis.r*255), g=Math.round(vis.g*255), b=Math.round(vis.b*255);
  const sr=Math.round(vis.sr*255), sg=Math.round(vis.sg*255), sb=Math.round(vis.sb*255);
  const intensity=(0.22+vis.fluid*.42)*(1+audioPulse*.35);

  for(let i=0;i<5;i++){
    const xOff=Math.sin(t*(0.6+i*.18)+i*1.1)*W*.28;
    const yPos=H*(0.04+i*.065+Math.sin(t*(.45+i*.12))*.035);
    const w2=W*(.38+i*.09);
    const h2=H*(.07+vis.fluid*.07);
    const blend=i/4;
    const cr=Math.round(r*(1-blend)+sr*blend);
    const cg=Math.round(g*(1-blend)+sg*blend);
    const cb2=Math.round(b*(1-blend)+sb*blend);

    const grad=ctx.createRadialGradient(W/2+xOff,yPos,0,W/2+xOff,yPos,w2);
    grad.addColorStop(0,`rgba(${cr},${cg},${cb2},${intensity*.24})`);
    grad.addColorStop(.5,`rgba(${cr},${cg},${cb2},${intensity*.08})`);
    grad.addColorStop(1,`rgba(${cr},${cg},${cb2},0)`);
    ctx.save();
    ctx.scale(1,h2/w2);
    ctx.beginPath();ctx.arc(W/2+xOff,yPos*w2/h2,w2,0,Math.PI*2);
    ctx.fillStyle=grad;ctx.fill();
    ctx.restore();
  }
}

drawFrame();

// ── EFFECT MODE SWITCH ────────────────────────────────────────────────────────
function setMode(m){
  effectMode=m;
  ["orbit","scatter","rain","vortex"].forEach(id=>{
    document.getElementById("m-"+id).classList.toggle("active",id===m);
  });
  if(m==="rain"&&vis) initRain(vis);
  if(m==="vortex") vortexDir=1;
}

// ── TRACK SELECTION ───────────────────────────────────────────────────────────
let currentTrack=null,transitioning=false;
function accent(v,a=1){return`rgba(${Math.round(v.r*255)},${Math.round(v.g*255)},${Math.round(v.b*255)},${a})`;}

function selectTrack(track){
  if(transitioning) return;
  transitioning=true;
  document.querySelectorAll(".pill").forEach(p=>p.classList.remove("active"));
  document.getElementById("pill-"+track.id)?.classList.add("active");
  document.getElementById("bottom-info").classList.remove("show");
  shockwaves=[];

  setTimeout(()=>{
    currentTrack=track;
    vis=mapV(track.f,track.origin);
    initParticles(vis);
    if(effectMode==="rain") initRain(vis);
    updateUI(track,vis);
    transitioning=false;
    document.getElementById("bottom-info").classList.add("show");
    const tn=document.getElementById("tname");
    tn.style.animation="none";tn.offsetHeight;tn.style.animation="rise .5s both";
  },320);
}

function updateUI(track,v){
  const tn=document.getElementById("tname");
  tn.textContent=track.name;
  tn.style.color=accent(v,.92);
  tn.style.textShadow=`0 0 40px ${accent(v,.5)},0 0 80px ${accent(v,.2)}`;
  document.getElementById("tsub").textContent=`${track.artist}  ·  ${track.origin}`;
  const il=track.inst.map(i=>ITEXTURES[i]||i).join(" · ");
  document.getElementById("tbadges").innerHTML=`
    <span class="badge" style="color:${accent(v,.85)};border-color:${accent(v,.35)}">${mood(v)}</span>
    <span class="badge" style="color:rgba(255,255,255,.3)">${v.label}</span>
    <span class="badge" style="color:rgba(255,255,255,.3)">${il}</span>`;
  const pList=[
    {l:"Energy",    val:v.energy},
    {l:"Warmth",    val:v.warmth},
    {l:"Turbulence",val:v.turbulence},
    {l:"Fluidity",  val:v.fluid},
    {l:"Density",   val:v.density},
  ];
  document.getElementById("params").innerHTML=pList.map(p=>`
    <div class="param-row"><div class="param-head">
      <span class="param-label">${p.l.toUpperCase()}</span>
      <span class="param-val">${(p.val*100).toFixed(0)}</span>
    </div><div class="bar-bg"><div class="bar-fill" style="width:${p.val*100}%;background:${accent(v,.75)}"></div></div></div>
  `).join("");
  const i255=n=>Math.round(n*255);
  document.getElementById("sw1").style.cssText=`background:rgb(${i255(v.r)},${i255(v.g)},${i255(v.b)});box-shadow:0 0 10px ${accent(v,.7)}`;
  document.getElementById("sw2").style.cssText=`background:rgb(${i255(v.sr)},${i255(v.sg)},${i255(v.sb)});box-shadow:0 0 8px rgba(${i255(v.sr)},${i255(v.sg)},${i255(v.sb)},.5)`;
}

const list=document.getElementById("track-list");
TRACKS.forEach(t=>{
  const el=document.createElement("div");
  el.className="pill";el.id="pill-"+t.id;
  el.innerHTML=`<div class="pill-name">${t.name}</div><div class="pill-artist">${t.artist}</div>`;
  el.onclick=()=>selectTrack(t);
  list.appendChild(el);
});
setTimeout(()=>selectTrack(TRACKS[0]),500);

// ── MIC ───────────────────────────────────────────────────────────────────────
let micCtx=null,micAnalyser=null,micStream=null,micRaf=null,micOn=false;
async function toggleMic(){
  if(micOn){stopMic();return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    micCtx=new(window.AudioContext||window.webkitAudioContext)();
    micAnalyser=micCtx.createAnalyser();
    micAnalyser.fftSize=512;
    micCtx.createMediaStreamSource(stream).connect(micAnalyser);
    const buf=new Uint8Array(micAnalyser.frequencyBinCount);
    micStream=stream;micOn=true;
    document.getElementById("btn-mic").classList.add("on");
    document.getElementById("btn-mic").textContent="◉ Live";
    document.getElementById("mic-status").style.display="block";
    const tick=()=>{
      micRaf=requestAnimationFrame(tick);
      micAnalyser.getByteFrequencyData(buf);
      const avg=buf.slice(0,48).reduce((a,b)=>a+b,0)/48;
      audioPulse=avg/255;
    };
    tick();
  }catch(e){
    alert("Mic access denied.\n\nOn iPhone: Settings → Safari → Microphone → allow hedaaditya-coder.github.io");
  }
}
function stopMic(){
  if(micRaf)cancelAnimationFrame(micRaf);
  if(micStream)micStream.getTracks().forEach(t=>t.stop());
  if(micCtx)micCtx.close();
  audioPulse=0;micOn=false;
  document.getElementById("btn-mic").classList.remove("on");
  document.getElementById("btn-mic").textContent="◎ Mic";
  document.getElementById("mic-status").style.display="none";
}

// ── CAPTURE ───────────────────────────────────────────────────────────────────
function captureFrame(){
  const name=(currentTrack?.name||"frame").replace(/\s/g,"_");
  const a=document.createElement("a");
  a.download=`synesthesia-${name}.png`;
  a.href=canvas.toDataURL("image/png");
  a.click();
}
